name: Build release artifacts

on:
  # Picking a workflow branch that is a tag, in combination with using the commit field is likely to fail for magic git clone/checkout reasons
  workflow_dispatch:
    inputs:
      packages:
        description: 'List of packages to build'
        required: true
        default: 'everything'
        type: choice
        options:
          - everything
          - archive
          - msvc
          - installer
          - sharedlib
      commit:
        description: 'Commit-ish (tag, branchname, sha) for code to build (uses scripts from the same branch as the workflow)'
        default: ''
  schedule:
    - cron: '15 09 * * *' # Run in the early hours of the morning (UTC)
  # Test representative packages when release build files change
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/release-build.yml'
      - '.github/actions/release-build/**'
      - '.github/actions/linux-release-builder/**'
      - '.github/actions/common/**'
      - '.github/actions/upload-release-asset.sh'
      - 'scripts/_git-all-archive.sh'
  release:
    types: published

# Uploading assets to a release needs write access to repository contents
permissions:
  contents: write

# Only pull request runs are grouped (and superseded by newer pushes); every other run is independent
concurrency:
  group: release-build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
#####################################
# Create all submodules archive
#####################################
  create-all-submodule-archive:
    name: Create all submodule archive
    runs-on: ubuntu-latest
    if: (github.event.action == 'published') || (github.event_name == 'workflow_dispatch' && (contains(github.event.inputs.packages, 'archive') || contains(github.event.inputs.packages, 'everything')))
    steps:
    - name: Determine fetch depth
      id: determine_fd
      shell: bash
      run: |
        unset DEPTH
        if [ -n '${{ github.event.inputs.commit }}' ]; then DEPTH='0'; else DEPTH='1'; fi
        echo "DEPTH=${DEPTH}" >> $GITHUB_OUTPUT

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ steps.determine_fd.outputs.DEPTH }}
      if: github.event.action == 'published' || github.event_name == 'workflow_dispatch'

    - name: Checkout shell scripts for workflow
      shell: bash
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.commit
      run: |
        git checkout ${{ github.event.inputs.commit }}
        git checkout ${{ github.ref_name }} -- scripts/_git-all-archive.sh || exit $?
        for i in $(git status --short | cut -f2 -d " "); do sha256sum $i; done
        exit 0

    - name: Create archive
      if: github.event_name != 'workflow_dispatch'
      # Creates the archive then moves it to an artifact subfolder
      run: ./scripts/_git-all-archive.sh -l "$(git rev-parse --abbrev-ref "${GITHUB_REF}")" && mkdir artifact && mv "Helics-$(git rev-parse --abbrev-ref "${GITHUB_REF}")-source.tar.gz" artifact/
    - name: Create archive (no version)
      if: github.event_name == 'workflow_dispatch'
      # Creates the archive then moves it to an artifact subfolder
      run: ./scripts/_git-all-archive.sh && mkdir artifact && mv "Helics-source.tar.gz" artifact/
     
    - name: Upload archive to release
      if: github.event_name != 'workflow_dispatch'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        UPLOAD_URL: ${{ github.event.release.upload_url }}
      run: ./.github/actions/upload-release-asset.sh "artifact/Helics-$(git rev-parse --abbrev-ref "${GITHUB_REF}")-source.tar.gz"
      
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: all-submodules-archive
        path: artifact
        if-no-files-found: error
        
#####################################
# Build MSVC archives
#####################################
  build-windows-msvc:
    runs-on: ${{ matrix.target.os }}
    name: Build ${{ matrix.target.os }} ${{ matrix.target.arch }} MSVC Archive
    if: (github.event_name != 'workflow_dispatch') || (contains(github.event.inputs.packages, 'msvc') || contains(github.event.inputs.packages, 'everything'))
    timeout-minutes: 120
    strategy:
      # Keep building the other packages when one fails so a release gets every asset that can be built
      fail-fast: false
      matrix:
        # windows-2019 (VS 2019) runner image was retired; VS 2026 replaces it
        event: ['${{ github.event_name }}']
        target:
          - &msvc2022
            os: windows-2022
            arch: x64
            cmake_gen: 'Visual Studio 17 2022'
            msvc_ver: 'msvc2022'
          - os: windows-2025-vs2026
            arch: x64
            cmake_gen: 'Visual Studio 18 2026'
            msvc_ver: 'msvc2026'
        exclude:
          - event: pull_request
            target: *msvc2022
    steps:
    - name: Determine fetch depth
      id: determine_fd
      shell: bash
      run: |
        unset DEPTH
        if [ -n '${{ github.event.inputs.commit }}' ]; then DEPTH='0'; else DEPTH='1'; fi
        echo "DEPTH=${DEPTH}" >> $GITHUB_OUTPUT

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ steps.determine_fd.outputs.DEPTH }}
      if: github.event_name != 'schedule'
    
    - name: Checkout main branch
      uses: actions/checkout@v7
      with:
        ref: main
      if: github.event_name == 'schedule'

    - name: Checkout shell scripts for workflow
      shell: bash
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.commit
      run: |
        git checkout ${{ github.event.inputs.commit }}
        git checkout ${{ github.ref_name }} -- .github/actions/ || exit $?
        for i in $(git status --short | cut -f2 -d " "); do sha256sum $i; done
        exit 0

    # Compile HELICS and create the installer
    - name: Build installer
      env:
        BUILD_ARCH: ${{ matrix.target.arch }}
        BUILD_GEN: ${{ matrix.target.cmake_gen }}
        MSVC_VER: ${{ matrix.target.msvc_ver }}
      shell: bash
      run: ./.github/actions/release-build/msvc-${{ runner.os }}.sh
        
    - name: Upload installer to release
      if: github.event.action == 'published'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        UPLOAD_URL: ${{ github.event.release.upload_url }}
      shell: bash
      run: ./.github/actions/upload-release-asset.sh "$(ls artifact/Helics-*.zip)"
      
    # GitHub Actions combines artifacts uploaded with the same name
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.target.os }}-msvc-installers
        path: artifact
        if-no-files-found: error
        
#####################################
# Build installers
#####################################
  build-installers:
    runs-on: ${{ matrix.target.os }}
    name: Build ${{ matrix.target.os }} ${{ matrix.target.arch }} ${{ matrix.target.cpack_gen }} Installer
    if: (github.event_name != 'workflow_dispatch') || (contains(github.event.inputs.packages, 'installer') || contains(github.event.inputs.packages, 'everything'))
    timeout-minutes: 120
    strategy:
      # Keep building the other packages when one fails so a release gets every asset that can be built
      fail-fast: false
      matrix:
        event: ['${{ github.event_name }}']
        target:
          - id: windows-x64
            os: windows-2025-vs2026
            arch: x64
            cpack_gen: NSIS;ZIP
            cmake_gen: 'Visual Studio 18 2026'
            msvc_ver: 'msvc2026'
          - &installer_windows_x86
            id: windows-x86
            os: windows-2025-vs2026
            arch: x86
            cpack_gen: ZIP
            cmake_gen: 'Visual Studio 18 2026'
            msvc_ver: 'msvc2026'
          - id: macos-universal2
            # macos-latest is now Apple Silicon; pin the image. Builds are universal (arm64;x86_64).
            os: macos-15
            arch: universal2
            cpack_gen: ZIP
            macos_target_ver: '10.15'
          - id: linux-x64
            os: ubuntu-latest
            arch: x64
            cpack_gen: TGZ
          - &installer_linux_aarch64
            id: linux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
            cpack_gen: TGZ
        exclude:
          - event: pull_request
            target: *installer_windows_x86
          - event: pull_request
            target: *installer_linux_aarch64

    steps:
    - name: Determine fetch depth
      id: determine_fd
      shell: bash
      run: |
        unset DEPTH
        if [ -n '${{ github.event.inputs.commit }}' ]; then DEPTH='0'; else DEPTH='1'; fi
        echo "DEPTH=${DEPTH}" >> $GITHUB_OUTPUT

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ steps.determine_fd.outputs.DEPTH }}
        submodules: recursive
      if: github.event_name != 'schedule'

    - name: Checkout main branch
      uses: actions/checkout@v7
      with:
        ref: main
        submodules: recursive
      if: github.event_name == 'schedule'
 
    - name: Checkout shell scripts for workflow
      shell: bash
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.commit
      run: |
        git checkout ${{ github.event.inputs.commit }}
        git checkout ${{ github.ref_name }} -- .github/actions/ || exit $?
        for i in $(git status --short | cut -f2 -d " "); do sha256sum $i; done
        exit 0

    # Compile HELICS and create the installer
    - name: Build installer
      if: runner.os != 'Linux'
      env:
        BUILD_ARCH: ${{ matrix.target.arch }}
        BUILD_GEN: ${{ matrix.target.cmake_gen }}
        MSVC_VER: ${{ matrix.target.msvc_ver }}
        MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target.macos_target_ver }}
        CPACK_GEN: ${{ matrix.target.cpack_gen }}
      shell: bash
      run: ./.github/actions/release-build/installer-${{ runner.os }}.sh
 
    - name: Build installer (container)
      if: runner.os == 'Linux'
      uses: ./.github/actions/linux-release-builder
      with:
        script: ./.github/actions/release-build/installer-${{ runner.os }}.sh
        cpack_gen: ${{ matrix.target.cpack_gen }}
        arch: ${{ matrix.target.arch }}

    - name: Check Linux installer exports
      if: runner.os == 'Linux'
      shell: bash
      run: bash ./.github/actions/release-build/check-linux-exports.sh artifact/Helics-*-Linux-*.tar.gz
       
    - name: Upload installer to release
      if: github.event.action == 'published'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        UPLOAD_URL: ${{ github.event.release.upload_url }}
      shell: bash
      run: for filename in artifact/Helics-*; do ./.github/actions/upload-release-asset.sh "${filename}"; done

    # GitHub Actions combines artifacts uploaded with the same name
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.target.id }}-installers
        path: artifact
        if-no-files-found: error
      
#####################################
# Build shared libraries
#####################################
  build-sharedlibs:
    runs-on: ${{ matrix.target.os }}
    if: (github.event_name != 'workflow_dispatch') || (contains(github.event.inputs.packages, 'sharedlib') || contains(github.event.inputs.packages, 'everything'))
    name: Build ${{ matrix.target.os }} ${{ matrix.target.arch }} Shared Library
    timeout-minutes: 120
    strategy:
      # Keep building the other packages when one fails so a release gets every asset that can be built
      fail-fast: false
      matrix:
        event: ['${{ github.event_name }}']
        target:
          - &sharedlib_windows_x86
            id: windows-x86
            os: windows-2025-vs2026
            arch: x86
            cmake_gen: 'Visual Studio 18 2026'
            msvc_ver: 'msvc2026'
          - id: windows-x64
            os: windows-2025-vs2026
            arch: x64
            cmake_gen: 'Visual Studio 18 2026'
            msvc_ver: 'msvc2026'
          - id: macos-universal2
            os: macos-15
            arch: universal2
            macos_target_ver: '10.15'
          - id: ubuntu-x64
            os: ubuntu-latest
            arch: x64
          - &sharedlib_linux_aarch64
            id: ubuntu-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
        exclude:
          - event: pull_request
            target: *sharedlib_windows_x86
          - event: pull_request
            target: *sharedlib_linux_aarch64

    steps:
    - name: Determine fetch depth
      id: determine_fd
      shell: bash
      run: |
        unset DEPTH
        if [ -n '${{ github.event.inputs.commit }}' ]; then DEPTH='0'; else DEPTH='1'; fi
        echo "DEPTH=${DEPTH}" >> $GITHUB_OUTPUT

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ steps.determine_fd.outputs.DEPTH }}
        submodules: recursive
      if: github.event_name != 'schedule'

    - name: Checkout main branch
      uses: actions/checkout@v7
      with:
        ref: main
        submodules: recursive
      if: github.event_name == 'schedule'

    - name: Checkout shell scripts for workflow
      shell: bash
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.commit
      run: |
        git checkout ${{ github.event.inputs.commit }}
        git checkout ${{ github.ref_name }} -- .github/actions/ || exit $?
        for i in $(git status --short | cut -f2 -d " "); do sha256sum $i; done
        exit 0

    # Compile HELICS and create the installer
    - name: Build shared library
      if: runner.os != 'Linux'
      env:
        BUILD_ARCH: ${{ matrix.target.arch }}
        BUILD_GEN: ${{ matrix.target.cmake_gen }}
        MSVC_VER: ${{ matrix.target.msvc_ver }}
        MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target.macos_target_ver }}
      shell: bash
      run: ./.github/actions/release-build/shared-library-${{ runner.os }}.sh
    
    - name: Build shared library (container)
      if: runner.os == 'Linux'
      uses: ./.github/actions/linux-release-builder
      with:
        script: ./.github/actions/release-build/shared-library-${{ runner.os }}.sh
        arch: ${{ matrix.target.arch }}

    - name: Check Linux shared library exports
      if: runner.os == 'Linux'
      shell: bash
      run: bash ./.github/actions/release-build/check-linux-exports.sh artifact/Helics-shared-*-Linux-*.tar.gz

    - name: Upload installer to release
      if: github.event.action == 'published'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        UPLOAD_URL: ${{ github.event.release.upload_url }}
      shell: bash
      run: ./.github/actions/upload-release-asset.sh "$(ls artifact/Helics-*)"
      
    # GitHub Actions combines artifacts uploaded with the same name
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.target.id }}-sharedlib-installers
        path: artifact
        if-no-files-found: error
        
#####################################
# Generate SHA-256 file
#####################################
  generate-sha256:
    name: Calculate SHA256 for release assets
    needs: [create-all-submodule-archive, build-installers, build-sharedlibs, build-windows-msvc]
    runs-on: ubuntu-latest
    if: github.event.action == 'published'
    steps:
    - uses: actions/checkout@v7
      
    - name: Get all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true
        
    - name: Create SHA-256 file
      run: cd artifacts && sha256sum * > "Helics-$(git rev-parse --abbrev-ref "${GITHUB_REF}")-SHA-256.txt"
      
    - name: Upload SHA-256 file to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        UPLOAD_URL: ${{ github.event.release.upload_url }}
      run: ./.github/actions/upload-release-asset.sh "artifacts/Helics-$(git rev-parse --abbrev-ref "${GITHUB_REF}")-SHA-256.txt"

#####################################
# Trigger helics-packaging workflows
#####################################
  send-version-update-event:
    name: Trigger helics-packaging workflows
    needs: [generate-sha256]
    runs-on: ubuntu-latest
    if: github.event.action == 'published'
    steps:
      - name: Run helics_version_update workflow in helics-packaging
        env:
          GH_TOKEN: ${{ secrets.HELICS_PACKAGING_TOKEN }}
        run: |
          HELICS_VERSION="${{ github.event.release.tag_name }}"
          gh workflow run --repo GMLC-TDC/helics-packaging helics_version_update.yml -f version="${HELICS_VERSION#v}"
