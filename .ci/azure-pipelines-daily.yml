trigger: none
pr: none
schedules:
  - cron: "0 10 * * *"
    displayName: Daily late night PST (GMT-8)
    branches:
      include:
        - main

parameters:
  - name: windowsBuildJobLimit
    displayName: Windows build job limit (0 uses the runner CPU count)
    type: number
    default: 4
    values: [0, 4]

jobs:
  - job: Linux
    strategy:
      matrix:
        all-tests:
          containerImage: "helics/buildenv:ubuntu24.04-default-builder"
          test_config: "daily"
        zmq-subproject:
          containerImage: "helics/buildenv:ubuntu24.04-default-builder"
          test_config: "ci"
          zmq_subproject: true
    pool:
      vmImage: "ubuntu-latest"
    container: $[ variables['containerImage'] ]
    timeoutInMinutes: 90

    steps:
      - bash: |
          unset VCPKG_ROOT
          if [[ "$TEST_CONFIG" == "ci" ]]; then
            source scripts/setup-filter-test-backtrace.sh
          fi
          source scripts/setup-helics-ci-options.sh
          mkdir -p build && cd build
          ../scripts/ci-build.sh
        env:
          MAKEFLAGS: "-j 4"
          CMAKE_GENERATOR: "Unix Makefiles"
          TEST_CONFIG: $[variables['test_config']]
          USE_SWIG: "true"
          ZMQ_SUBPROJECT: $[variables['zmq_subproject']]
          ZMQ_FORCE_SUBPROJECT: $[variables['zmq_subproject']]
        displayName: "Build HELICS"

      - bash: ../scripts/run-ci-tests.sh "$TEST_CONFIG"
        env:
          TEST_CONFIG: $[variables['test_config']]
        workingDirectory: "build"
        displayName: "Test HELICS"

  - job: Windows
    strategy:
      matrix:
        VS2022-64bit:
          imageName: "windows-2022"
          langArch: "x64"
          vsArch: "x64"
          extraFlags: ""
          buildExamples: "ON"
          enablePackageBuild: "ON"
    pool:
      vmImage: $(imageName)
    variables:
      BOOST_ROOT: $(Pipeline.Workspace)/ci-libs/boost
      BOOST_URL: https://sourceforge.net/projects/boost/files/boost/1.83.0/boost_1_83_0.tar.bz2/download

    steps:
      # -----------------------
      # Install dependencies
      # -----------------------
      - template: azure-windows-dependencies.yml
      - bash: swig -version
        condition: eq( variables['Agent.OS'], 'Windows_NT' )
        displayName: Show swig version

      # -----------------------
      # Configure HELICS
      # -----------------------
      - bash: |
          echo "BOOST_ROOT=$BOOST_ROOT"
          echo "NUMBER_OF_PROCESSORS=$NUMBER_OF_PROCESSORS"
          env
        displayName: Show environment info
      - task: CMake@1
        inputs:
          cmakeArgs: >-
            -A $(vsArch) -DBOOST_INSTALL_PATH="$(BOOST_ROOT)"
            -DHELICS_ENABLE_SUBMODULE_UPDATE=OFF -DHELICS_ENABLE_SWIG=ON
            -DHELICS_BUILD_CXX_SHARED_LIB=ON -DHELICS_ENABLE_PACKAGE_BUILD=$(enablePackageBuild)
            -DHELICS_BUILD_TESTS=ON -DHELICS_BUILD_EXAMPLES=$(buildExamples)
            -DHELICS_DISABLE_VCPKG=ON -DHELICS_EMBEDDED_DEBUG_INFO=external $(extraFlags) ..
        displayName: "Configure HELICS"
        condition: eq( variables['Agent.OS'], 'Windows_NT' )

      #  - task: CMake@1
      #    inputs:
      #      cmakeArgs: -DHELICS_BUILD_JAVA_INTERFACE=ON .
      #    displayName: 'Configure Java interface'
      #    condition: eq( variables['langArch'], 'x64' )

      # -----------------------
      # Build HELICS
      # -----------------------
      - bash: |
          runner_cpus=${NUMBER_OF_PROCESSORS:-8}
          build_jobs=$runner_cpus
          if (( WINDOWS_BUILD_JOB_LIMIT > 0 && WINDOWS_BUILD_JOB_LIMIT < runner_cpus )); then
            build_jobs=$WINDOWS_BUILD_JOB_LIMIT
          fi
          echo "Building with $build_jobs jobs on $runner_cpus logical CPUs"
          TIMEFORMAT='Release build wall time: %3R seconds'
          time cmake --build . --parallel "$build_jobs" --config Release
        displayName: "Build HELICS"
        workingDirectory: build
        env:
          WINDOWS_BUILD_JOB_LIMIT: "${{ parameters.windowsBuildJobLimit }}"

      # -----------------------
      # Package HELICS
      # -----------------------
      - bash: |
          cpack_dir="$(which cmake)"
          cpack_dir="${cpack_dir%/cmake}"
          "${cpack_dir}/cpack" -G "ZIP" -C Release -B "$PWD/installer-output"
        displayName: "Package HELICS"
        workingDirectory: build
      - task: CopyFiles@2
        inputs:
          sourceFolder: "$(Build.SourcesDirectory)/build/installer-output"
          contents: "*.exe"
          TargetFolder: "$(Build.ArtifactStagingDirectory)"

      - task: PublishBuildArtifacts@1
        inputs:
          pathtoPublish: "$(Build.ArtifactStagingDirectory)"
          artifactName: installer

      # -----------------------
      # Test HELICS
      # -----------------------
      - bash: ctest --output-on-failure --timeout 480 -C Release -L "Continuous"
        displayName: "Test HELICS"
        workingDirectory: build

      # Packaging tests
      - bash: ctest --output-on-failure --timeout 200 -C Release -L "PackagingFast"
        displayName: "Test HELICS packaging"
        workingDirectory: build

      # For debugging, can get build folder contents by adding PublishBuildArtifacts task and set pathtoPublish: '$(Build.SourcesDirectory)/build'
